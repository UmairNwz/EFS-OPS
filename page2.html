<!doctype html>
<html data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Service Breakdown</title>
<style>
:root {
  --bg:#f9fafb; --surface:#fff; --border:#e5e7eb;
  --fg:#111827; --muted:#6b7280; --accent:#e31e24;
  --seg-economy:#3b82f6; --seg-intercity:#7c3aed;
  --seg-moto:#f97316; --seg-rickshaw:#d97706;
  --seg-comfort:#059669; --seg-comfortplus:#0891b2;
  --seg-cargo:#6b7280; --seg-minivan:#db2777;
  font-size:14px; color-scheme:light;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111827; --surface:#1f2937; --border:#374151;
  --fg:#f9fafb; --muted:#9ca3af; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111827; --surface:#1f2937; --border:#374151;
  --fg:#f9fafb; --muted:#9ca3af; color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif;min-height:100vh}
/* topbar */
.topbar{background:#1a1a2e;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.topbar-brand{font-weight:700;font-size:15px;color:#fff;text-decoration:none}
.topbar-brand span{color:var(--accent)}
.topbar-nav{display:flex;gap:4px;margin-left:auto}
.nav-btn{padding:5px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none;text-decoration:none;display:inline-block}
.nav-btn.secondary{background:rgba(255,255,255,.12);color:#fff}
.nav-btn.secondary:hover{background:rgba(255,255,255,.2)}
.nav-btn.active{background:var(--accent);color:#fff}
.topbar-sync{font-size:11px;color:rgba(255,255,255,.5);margin-left:auto}
/* main */
.main{padding:20px;max-width:1400px;margin:0 auto}
/* controls */
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.mode-group{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.mode-btn{padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;background:transparent;border:none;color:var(--muted)}
.mode-btn.on{background:var(--accent);color:#fff}
.nav-arrow{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:14px;color:var(--fg)}
.nav-arrow:hover{background:var(--border)}
.period-label{font-weight:600;font-size:13px;min-width:120px;text-align:center}
/* kpi row */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.kpi-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:4px}
.kpi-value{font-size:22px;font-weight:700;line-height:1.1}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:3px}
/* segment dot */
.seg-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
/* charts grid */
.charts-row{display:grid;grid-template-columns:1fr 300px;gap:16px;margin-bottom:20px}
@media(max-width:700px){.charts-row{grid-template-columns:1fr}}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px}
.chart-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:12px}
canvas{width:100%!important}
/* table */
.seg-table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow-x:auto;margin-bottom:20px}
.seg-table{width:100%;border-collapse:collapse;font-size:13px}
.seg-table th{padding:10px 14px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:1px solid var(--border)}
.seg-table td{padding:10px 14px;border-bottom:1px solid var(--border)}
.seg-table tr:last-child td{border-bottom:none}
.seg-table tr:hover td{background:rgba(0,0,0,.025)}
.seg-name{display:flex;align-items:center;gap:6px;font-weight:600}
.bar-cell{width:140px}
.mini-bar{height:6px;border-radius:3px;background:var(--border);position:relative;overflow:hidden}
.mini-bar-fill{height:100%;border-radius:3px;position:absolute;left:0;top:0}
.text-right{text-align:right}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
</style>
</head>

<div class="topbar">
  <a href="index.html" class="topbar-brand">Express <span>Fleet</span></a>

  <div class="kpi-row" id="kpiRow"></div>

    </div>
    <div class="chart-card">
      <div class="chart-title">Share of Trips</div>
      <canvas id="donutChart" height="220"></canvas>

  </div>

  <div class="seg-table-wrap">

      <thead>

        </tr>
      </thead>
      <tbody id="segTableBody"></tbody>

  </div>
</div>

const SEG_LATEST = "2026-11-27";
// ────────────────────────────────────────────────────────────────────────────

const SEGS = ["Economy","City to City","Moto","Tuk-tuk","Delivery","Comfort","Comfort+","B2B","Courier","Cargo","Minivan"];
const SEG_COLORS = {
  "Economy":"#3b82f6","City to City":"#7c3aed","Moto":"#f97316","Tuk-tuk":"#d97706",
  "Delivery":"#f43f5e","Comfort":"#14b8a6","Comfort+":"#0891b2",
  "B2B":"#6366f1","Courier":"#ec4899","Cargo":"#6b7280","Minivan":"#a855f7"
};

// Build lookup: IDX2[date][segment] = {t, g}
const IDX2 = {};
SEG.forEach(r => {
  if(!IDX2[r.d]) IDX2[r.d] = {};
  IDX2[r.d][r.s] = {t:r.t, g:r.g};
});

const ALL_DATES = [...new Set(SEG.map(r=>r.d))].sort();
const LATEST = SEG_LATEST;

function addDays(d,n){const dt=new Date(d+'T00:00:00');dt.setDate(dt.getDate()+n);return dt.toISOString().slice(0,10)}
function getMonday(d){const dt=new Date(d+'T00:00:00');const day=dt.getDay();const diff=day===0?-6:1-day;dt.setDate(dt.getDate()+diff);return dt.toISOString().slice(0,10)}
function fmtDate(d){const dt=new Date(d+'T00:00:00');return dt.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
function fmtMonth(d){const dt=new Date(d+'T00:00:00');return dt.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}
function fmtM(n){if(n>=1e6)return (n/1e6).toFixed(2)+'M';if(n>=1e3)return (n/1e3).toFixed(0)+'K';return String(n)}
function fmt(n){return n==null?'—':n.toLocaleString()}

let mode = 'month';
let anchor = LATEST.slice(0,7)+'-01';

function setMode(m){
  mode=m;
  if(m==='day') anchor=LATEST;
  else if(m==='week') anchor=getMonday(LATEST);
  else anchor=LATEST.slice(0,7)+'-01';
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('on',b.textContent.toLowerCase()===m));
  render();
}

function shiftAnchor(dir){
  if(mode==='day')      anchor=addDays(anchor,dir);
  else if(mode==='week') anchor=addDays(anchor,dir*7);
  else {
    const dt=new Date(anchor+'T00:00:00');
    dt.setMonth(dt.getMonth()+dir);
    anchor=dt.toISOString().slice(0,7)+'-01';
  }
  render();
}

function getDatesForPeriod(){
  if(mode==='day') return [anchor];
  if(mode==='week'){
    const days=[];
    for(let i=0;i<7;i++) days.push(addDays(anchor,i));
    return days;
  }
  // month
  const ym=anchor.slice(0,7);
  return ALL_DATES.filter(d=>d.startsWith(ym));
}

function aggregateForPeriod(dates){
  const totals={};
  SEGS.forEach(s=>totals[s]={t:0,g:0,dr:new Set()});
  dates.forEach(d=>{
    const day=IDX2[d]||{};
    SEGS.forEach(s=>{
      const v=day[s];
      if(v){totals[s].t+=v.t;totals[s].g+=v.g;}
    });
  });
  // convert sets (we don't track drivers here, just trips/gross)
  return totals;
}

function getPeriodLabel(){
  if(mode==='day') return fmtDate(anchor);
  if(mode==='week') return fmtDate(anchor)+' – '+fmtDate(addDays(anchor,6));
  return fmtMonth(anchor);
}

function render(){
  document.getElementById('periodLabel').textContent=getPeriodLabel();
  const dates=getDatesForPeriod();
  const agg=aggregateForPeriod(dates);

  const grandTotal=SEGS.reduce((s,sg)=>s+agg[sg].t,0);
  const grandGross=SEGS.reduce((s,sg)=>s+agg[sg].g,0);

  renderKPIs(agg, grandTotal, grandGross);
  renderTable(agg, grandTotal);
  renderTrend(dates);
  renderDonut(agg, grandTotal);
}

function renderKPIs(agg, grandTotal, grandGross){
  const avgFare=grandTotal>0?Math.round(grandGross/grandTotal):0;
  // Sort segs by trip count
  const sorted=[...SEGS].sort((a,b)=>agg[b].t-agg[a].t).filter(s=>agg[s].t>0);
  const cards=[];
  sorted.slice(0,4).forEach(s=>{
    const pct=grandTotal>0?Math.round(agg[s].t/grandTotal*100):0;
    cards.push(`<div class="kpi-card">
      <div class="kpi-label"><span class="seg-dot" style="background:${SEG_COLORS[s]}"></span>${s}</div>
      <div class="kpi-value">${fmt(agg[s].t)}</div>
      <div class="kpi-sub">${pct}% · avg PKR ${fmt(agg[s].t?Math.round(agg[s].g/agg[s].t):0)}</div>
    </div>`);
  });
  cards.push(`<div class="kpi-card">
    <div class="kpi-label">Total Trips</div>
    <div class="kpi-value">${fmt(grandTotal)}</div>
    <div class="kpi-sub">PKR ${fmtM(grandGross)}</div>
  </div>`);
  cards.push(`<div class="kpi-card">
    <div class="kpi-label">Avg Fare / Trip</div>
    <div class="kpi-value">PKR ${fmt(avgFare)}</div>
    <div class="kpi-sub">all segments combined</div>
  </div>`);
  document.getElementById('kpiRow').innerHTML=cards.join('');
}

function renderTable(agg, grandTotal){
  const maxTrips=Math.max(...SEGS.map(s=>agg[s].t),1);
  const sorted=[...SEGS].sort((a,b)=>agg[b].t-agg[a].t);
  const rows=sorted.map(s=>{
    const trips=agg[s].t, gross=agg[s].g;
    const pct=grandTotal>0?(trips/grandTotal*100).toFixed(1):0;
    const avg=trips>0?Math.round(gross/trips):0;
    const barW=(trips/maxTrips*100).toFixed(1);
    if(!trips) return '';
    return `<tr>
      <td class="seg-name"><span class="seg-dot" style="background:${SEG_COLORS[s]}"></span>${s}</td>
      <td class="text-right">${fmt(trips)}</td>
      <td class="text-right">${pct}%</td>
      <td class="bar-cell"><div class="mini-bar"><div class="mini-bar-fill" style="width:${barW}%;background:${SEG_COLORS[s]}"></div></div></td>
      <td class="text-right">${fmtM(gross)}</td>
      <td class="text-right"><strong>PKR ${fmt(avg)}</strong></td>
      <td class="text-right">—</td>
    </tr>`;
  });
  document.getElementById('segTableBody').innerHTML=rows.join('');
}

// ── Canvas charts ─────────────────────────────────────────────────────────────
const DPR=window.devicePixelRatio||1;
function setupCanvas(id){
  const c=document.getElementById(id);
  const w=c.parentElement.clientWidth-32;
  const h=parseInt(c.getAttribute('height'));
  c.width=w*DPR; c.height=h*DPR;
  c.style.width=w+'px'; c.style.height=h+'px';
  const ctx=c.getContext('2d');
  ctx.scale(DPR,DPR);
  return {ctx,w,h};
}

function getStyle(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}

function renderDonut(agg, grandTotal){
  const {ctx,w,h}=setupCanvas('donutChart');
  const segsWithData=[...SEGS].filter(s=>agg[s].t>0).sort((a,b)=>agg[b].t-agg[a].t);
  const cx=w/2, cy=h*0.45, r=Math.min(cx,cy)*0.75, ir=r*0.55;
  let angle=-Math.PI/2;
  const fg=getStyle('--fg');
  const muted=getStyle('--muted');
  segsWithData.forEach(s=>{
    const slice=(agg[s].t/grandTotal)*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,angle,angle+slice);
    ctx.closePath();
    ctx.fillStyle=SEG_COLORS[s];
    ctx.fill();
    angle+=slice;
  });
  // inner hole
  ctx.beginPath();
  ctx.arc(cx,cy,ir,0,Math.PI*2);
  ctx.fillStyle=getStyle('--surface');
  ctx.fill();
  // center label
  ctx.fillStyle=fg;
  ctx.font=`bold ${Math.round(ir*0.5)}px system-ui`;
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(fmt(grandTotal),cx,cy-6);
  ctx.font=`${Math.round(ir*0.28)}px system-ui`;
  ctx.fillStyle=muted;
  ctx.fillText('trips',cx,cy+ir*0.3);
  // legend
  const legY=h*0.86;
  const legX=w*0.05;
  const cols=Math.min(segsWithData.length,4);
  const colW=w/cols;
  segsWithData.slice(0,cols).forEach((s,i)=>{
    const x=legX+i*colW;
    ctx.fillStyle=SEG_COLORS[s];
    ctx.beginPath();ctx.arc(x+5,legY,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=muted;
    ctx.font='10px system-ui';ctx.textAlign='left';
    ctx.fillText(s,x+13,legY+4);
  });
  if(segsWithData.length>4){
    segsWithData.slice(4).forEach((s,i)=>{
      const x=legX+i*colW;
      ctx.fillStyle=SEG_COLORS[s];
      ctx.beginPath();ctx.arc(x+5,legY+16,4,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=muted;
      ctx.fillText(s,x+13,legY+20);
    });
  }
}

function renderTrend(dates){
  if(!dates.length) return;
  const {ctx,w,h}=setupCanvas('trendChart');
  const MT=20,MB=30,ML=48,MR=12;
  const cW=w-ML-MR, cH=h-MT-MB;
  const fg=getStyle('--fg');
  const muted=getStyle('--muted');
  const border=getStyle('--border');
  const segsWithData=[...SEGS].filter(s=>dates.some(d=>IDX2[d]&&IDX2[d][s]&&IDX2[d][s].t>0));
  if(!segsWithData.length) return;
  // For many dates: stacked bars; for few: grouped or lines
  const n=dates.length;
  const slotW=cW/Math.max(n,1);
  // find max total per day
  let maxTotal=1;
  dates.forEach(d=>{
    const tot=segsWithData.reduce((s,sg)=>s+(IDX2[d]&&IDX2[d][sg]?IDX2[d][sg].t:0),0);
    if(tot>maxTotal) maxTotal=tot;
  });
  // draw grid lines
  ctx.strokeStyle=border; ctx.lineWidth=1; ctx.setLineDash([2,3]);
  for(let i=0;i<=4;i++){
    const y=MT+cH*(1-i/4);
    ctx.beginPath();ctx.moveTo(ML,y);ctx.lineTo(ML+cW,y);ctx.stroke();
    ctx.fillStyle=muted;ctx.font='10px system-ui';ctx.textAlign='right';
    ctx.fillText(fmt(Math.round(maxTotal*i/4)),ML-4,y+3);
  }
  ctx.setLineDash([]);
  // stacked bars
  dates.forEach((d,i)=>{
    const x=ML+i*slotW;
    const bw=Math.max(slotW*0.72,1);
    const xc=x+(slotW-bw)/2;
    let yOff=0;
    segsWithData.forEach(s=>{
      const v=IDX2[d]&&IDX2[d][s]?IDX2[d][s].t:0;
      if(!v) return;
      const bh=(v/maxTotal)*cH;
      const yTop=MT+cH-yOff-bh;
      ctx.fillStyle=SEG_COLORS[s];
      ctx.fillRect(xc,yTop,bw,bh);
      yOff+=bh;
    });
    // x label
    if(n<=14 || i%Math.ceil(n/7)===0){
      ctx.fillStyle=muted;ctx.font='10px system-ui';ctx.textAlign='center';
      const lbl=n===1?fmtDate(d):n<=7?['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][new Date(d+'T00:00:00').getDay()]:fmtDate(d);
      ctx.fillText(lbl,x+slotW/2,h-MB+14);
    }
  });
  // tooltip on hover handled separately if needed (skip for now — keep it simple)
}

render();
window.addEventListener('resize',()=>render());
</script>
